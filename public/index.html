<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio to Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="screen">
  <div class="login-card">
    <div class="login-icon">&#127908;</div>
    <h1 class="login-title">Audio to Text</h1>
    <p class="login-desc">오디오/영상을 텍스트로 변환하고 맞춤법을 교정합니다</p>
    <form id="loginForm" autocomplete="off">
      <input type="password" id="passwordInput" class="input" placeholder="비밀번호" required>
      <button type="submit" class="btn btn-primary btn-full">로그인</button>
      <p id="loginError" class="error-text" hidden></p>
    </form>
  </div>
</div>

<!-- Main Screen -->
<div id="mainScreen" class="screen" hidden>
  <header class="header">
    <div class="header-left">
      <span class="header-icon">&#127908;</span>
      <span class="header-title">Audio to Text</span>
    </div>
    <button id="logoutBtn" class="btn btn-ghost">로그아웃</button>
  </header>

  <main class="main">
    <!-- Upload Section -->
    <section class="card" id="uploadSection">
      <h2 class="card-title">파일 업로드</h2>
      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">&#128193;</div>
        <p class="drop-text">오디오/영상 파일을 끌어놓으세요</p>
        <p class="drop-sub">또는 클릭하여 선택 (최대 200MB)</p>
        <input type="file" id="fileInput" accept="audio/*,video/*,.mp3,.mp4,.m4a,.wav,.ogg,.webm,.flac,.aac,.wma,.mov,.avi,.mkv" hidden>
      </div>
      <div id="fileInfo" class="file-info" hidden>
        <span id="fileName" class="file-name"></span>
        <span id="fileSize" class="file-size"></span>
        <button id="fileClear" class="btn btn-ghost btn-sm">X</button>
      </div>
      <button id="startBtn" class="btn btn-primary btn-full" disabled>변환 시작</button>
    </section>

    <!-- Progress Section -->
    <section class="card" id="progressSection" hidden>
      <h2 class="card-title">처리 중</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText">준비 중...</p>
    </section>

    <!-- Result Section -->
    <section class="card" id="resultSection" hidden>
      <h2 class="card-title">결과</h2>
      <div class="result-tabs">
        <button class="tab active" data-tab="corrected">교정 텍스트</button>
        <button class="tab" data-tab="original">원본 텍스트</button>
        <button class="tab" data-tab="diff">비교</button>
      </div>

      <div class="tab-content" id="tabCorrected">
        <textarea class="result-text" id="correctedText"></textarea>
      </div>
      <div class="tab-content" id="tabOriginal" hidden>
        <textarea class="result-text" id="originalText"></textarea>
      </div>
      <div class="tab-content" id="tabDiff" hidden>
        <div class="diff-view" id="diffView"></div>
      </div>

      <div id="changesSummary" class="changes-summary" hidden>
        <p class="changes-title">변경사항: <span id="changesCount">0</span>건</p>
        <ul class="changes-list" id="changesList"></ul>
      </div>

      <div class="result-actions">
        <button class="btn btn-primary" id="copyBtn">복사</button>
        <button class="btn btn-secondary" id="downloadBtn">TXT 다운로드</button>
        <button class="btn btn-secondary" id="srtBtn">SRT 다운로드</button>
      </div>
    </section>

    <!-- History Section -->
    <section class="card" id="historySection" hidden>
      <h2 class="card-title">변환 이력</h2>
      <ul class="history-list" id="historyList"></ul>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
